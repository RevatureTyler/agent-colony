<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Agent Colony</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "../node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <header>
    <h1>🏰 Agent Colony</h1>
    <span id="timeLabel" class="time-label"></span>
    <span id="buildingCount" class="building-count" hidden></span>
    <button id="addBtn">+ Add project</button>
  </header>
  <main id="scene-wrap">
    <div id="labels"></div>
  </main>
  <aside id="sidebar">
    <h2>Realm Log</h2>
    <input id="sidebarSearch" class="sidebar-search" type="text" placeholder="Filter projects..." />
    <ul id="threadList"></ul>
  </aside>
  <div id="toasts"></div>
  <div id="actionPanel" class="action-panel" hidden>
    <div class="action-panel-title" id="apTitle"></div>
    <div class="action-panel-status" id="apStatus"></div>
    <div class="action-panel-buttons">
      <button id="apLaunch" class="ap-btn ap-primary">Enter</button>
      <button id="apRemove" class="ap-btn ap-danger">Abandon</button>
      <button id="apCancel" class="ap-btn">Close</button>
    </div>
  </div>
  <p id="empty" class="empty-msg" hidden>No projects yet — click "Add project" to register a folder.</p>
  <p id="hint" class="hint-msg">Scroll to zoom · drag to orbit · click a building to select · H for home view</p>
  <script type="module" src="renderer.js"></script>
</body>
</html>
